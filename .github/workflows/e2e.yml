name: End to End

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node:
          - 22

    steps:
      - uses: actions/checkout@v3

      - name: Setup rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Setup node v${{ matrix.node }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      - name: NPM install
        run: npm install

      - name: Setup dfx
        uses: dfinity/setup-dfx@main

      - name: Start dfx
        run: dfx start --background

      - name: Create canisters
        run: dfx canister create --all

      - name: Build Rust backend
        run: |
          cd src/backend
          cargo build --target wasm32-unknown-unknown --release

      - name: Build backend canister
        run: |
          dfx build backend
          dfx stop

      - name: Install frontend dependencies
        run: cd src/frontend && npm install

      - name: Build frontend
        run: cd src/frontend && npm run build:dfx

      - name: Deploy all canisters
        run: |
          dfx start --background
          dfx deploy
          dfx stop

      - name: Check Lint
        run: npm run format

      - name: Run tests
        run: npm run test
        env:
          CI: true
          REPLICA_PORT: 8000
